<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle pitch circle motif -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Main Trophy Icon -->
  <g filter="url(#shadow)">
    <!-- Trophy Cup Body -->
    <path d="M 180 150 L 332 150 C 332 230 300 280 256 295 C 212 280 180 230 180 150 Z" fill="url(#gold)" />
    
    <!-- Trophy Rim Top -->
    <ellipse cx="256" cy="150" rx="76" ry="14" fill="#fef08a" />
    
    <!-- Left Handle -->
    <path d="M 180 165 C 130 165 125 240 188 250 C 180 238 175 220 178 185" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Right Handle -->
    <path d="M 332 165 C 382 165 387 240 324 250 C 332 238 337 220 334 185" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Stem -->
    <rect x="244" y="295" width="24" height="45" fill="url(#gold)" rx="4" />
    
    <!-- Base tier 1 -->
    <polygon points="216,340 296,340 310,360 202,360" fill="#eab308" />
    
    <!-- Base tier 2 (pedestal) -->
    <rect x="190" y="360" width="132" height="32" rx="8" fill="#1e293b" />
    <rect x="220" y="368" width="72" height="16" rx="4" fill="url(#gold)" />

    <!-- Mini Soccer Ball inside Trophy -->
    <circle cx="256" cy="210" r="32" fill="#ffffff" />
    <!-- Ball pentagons -->
    <polygon points="256,196 268,205 264,218 248,218 244,205" fill="#0f172a" />
    <line x1="256" y1="196" x2="256" y2="182" stroke="#0f172a" stroke-width="3" />
    <line x1="268" y1="205" x2="282" y2="202" stroke="#0f172a" stroke-width="3" />
    <line x1="264" y1="218" x2="274" y2="232" stroke="#0f172a" stroke-width="3" />
    <line x1="248" y1="218" x2="238" y2="232" stroke="#0f172a" stroke-width="3" />
    <line x1="244" y1="205" x2="230" y2="202" stroke="#0f172a" stroke-width="3" />

    <!-- Stars for achievement -->
    <polygon points="256,108 261,122 276,122 264,131 268,145 256,136 244,145 248,131 236,122 251,122" fill="#fbbf24" />
  </g>
</svg>
